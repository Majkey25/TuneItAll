name: Bug report
description: Report a reproducible TuneItAll problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include private audio, credentials, signing files, or personal data.
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Samsung Galaxy S25 Ultra, Android 16
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Tuner mode
      options: [Auto, Manual, Chromatic, Not applicable]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. Open TuneItAll\n2. Select...\n3. Play..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
