name: Play closed-test bundle

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play-bundle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TUNEITALL_KEYSTORE_PATH: ${{ github.workspace }}/tuneitall-upload.jks
      TUNEITALL_KEYSTORE_PASSWORD: ${{ secrets.TUNEITALL_KEYSTORE_PASSWORD }}
      TUNEITALL_KEY_ALIAS: ${{ secrets.TUNEITALL_KEY_ALIAS }}
      TUNEITALL_KEY_PASSWORD: ${{ secrets.TUNEITALL_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic

      - name: Restore upload keystore
        env:
          TUNEITALL_KEYSTORE_BASE64: ${{ secrets.TUNEITALL_KEYSTORE_BASE64 }}
        run: |
          test -n "$TUNEITALL_KEYSTORE_BASE64"
          printf '%s' "$TUNEITALL_KEYSTORE_BASE64" | base64 --decode > "$TUNEITALL_KEYSTORE_PATH"

      - name: Build and verify signed bundle
        shell: pwsh
        run: |
          chmod +x ./gradlew
          ./tools/build.ps1

      - name: Upload Play bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: intoniva-play-bundle-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Remove upload keystore
        if: always()
        run: rm -f "$TUNEITALL_KEYSTORE_PATH"
