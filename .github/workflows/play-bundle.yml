name: Play closed-test bundle

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Reviewed release tag, reachable from protected main
        required: true
        type: string

permissions:
  contents: read

jobs:
  bundle:
    permissions:
      # The reusable workflow declares conditional publication; executed Play jobs stay read-only.
      contents: write
      actions: read
    uses: Majkey25/TuneItAll/.github/workflows/secure-release.yml@main
    with:
      kind: play
      tag: ${{ inputs.release_tag }}
