name: Draft signed release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TUNEITALL_KEYSTORE_PATH: ${{ runner.temp }}/tuneitall-upload.jks
      TUNEITALL_KEYSTORE_PASSWORD: ${{ secrets.TUNEITALL_KEYSTORE_PASSWORD }}
      TUNEITALL_KEY_ALIAS: ${{ secrets.TUNEITALL_KEY_ALIAS }}
      TUNEITALL_KEY_PASSWORD: ${{ secrets.TUNEITALL_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic

      - name: Restore upload keystore
        env:
          TUNEITALL_KEYSTORE_BASE64: ${{ secrets.TUNEITALL_KEYSTORE_BASE64 }}
        run: |
          test -n "$TUNEITALL_KEYSTORE_BASE64"
          printf '%s' "$TUNEITALL_KEYSTORE_BASE64" | base64 --decode > "$TUNEITALL_KEYSTORE_PATH"

      - name: Build and verify signed bundle
        shell: pwsh
        run: |
          chmod +x ./gradlew
          ./tools/build.ps1

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "app/build/outputs/bundle/release/app-release.aab#TuneItAll $GITHUB_REF_NAME signed Android App Bundle"
          --draft --verify-tag --generate-notes --title "TuneItAll $GITHUB_REF_NAME"

      - name: Remove upload keystore
        if: always()
        run: rm -f "$TUNEITALL_KEYSTORE_PATH"
