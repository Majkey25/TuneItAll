name: Preview APK release

on:
  push:
    tags:
      - "v*-alpha.*"
      - "v*-beta.*"
      - "v*-rc.*"

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
      actions: read
    uses: Majkey25/TuneItAll/.github/workflows/secure-release.yml@main
    with:
      kind: preview
      tag: ${{ github.ref_name }}
      source_sha: ${{ github.sha }}
