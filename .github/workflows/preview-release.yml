name: Preview APK release

on:
  push:
    tags:
      - "v*-alpha.*"
      - "v*-beta.*"
      - "v*-rc.*"

permissions:
  contents: write

concurrency:
  group: preview-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic

      - name: Restore preview signing key
        env:
          TUNEITALL_PREVIEW_KEYSTORE_BASE64: ${{ secrets.TUNEITALL_PREVIEW_KEYSTORE_BASE64 }}
        run: |
          test -n "$TUNEITALL_PREVIEW_KEYSTORE_BASE64"
          mkdir -p "$HOME/.android"
          printf '%s' "$TUNEITALL_PREVIEW_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"

      - name: Build and verify testing APK
        shell: pwsh
        run: |
          chmod +x ./gradlew
          ./tools/build.ps1 -AllowUnsigned

      - name: Prepare release assets
        run: |
          asset="TuneItAll-${GITHUB_REF_NAME}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$asset"
          sha256sum "$asset" > "$asset.sha256"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="TuneItAll-${GITHUB_REF_NAME}-debug.apk"
          gh release create "$GITHUB_REF_NAME" \
            "$asset#TuneItAll $GITHUB_REF_NAME testing APK" \
            "$asset.sha256#SHA-256 checksum" \
            --prerelease \
            --verify-tag \
            --title "TuneItAll $GITHUB_REF_NAME" \
            --notes-file .github/release-notes/preview.md

      - name: Remove preview signing key
        if: always()
        run: rm -f "$HOME/.android/debug.keystore"
